name: Publish Maven artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Build and stage Maven repository
        run: bash ./gradlew publishMavenArtifacts

      - name: Publish Maven repository branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          maven_dir="$RUNNER_TEMP/mixson-maven"
          rm -rf "$maven_dir"
          mkdir -p "$maven_dir"
          cd "$maven_dir"

          git init -b maven
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          if git fetch origin maven; then
            git checkout -B maven FETCH_HEAD
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/build/maven-repository/." .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Maven repository is already up to date."
          else
            git commit -m "Publish Maven artifacts"
            git push origin HEAD:maven
          fi
